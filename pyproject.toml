[project]
name = "transcription-server"
version = "0.1.0"
description = "Serveur de transcription Parakeet avec diarization"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "nemo_toolkit[asr]==3.0.0",
    "pyannote.audio>=4.0,<5.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # httpx2 et non httpx : starlette >= 1.6 tente `import httpx2 as httpx`
    # dans son TestClient et deprecie l'ancien, avec un avertissement que
    # `filterwarnings = ["error"]` transformerait en echec.
    "httpx2>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: nécessite CUDA et les dépendances de l'extra gpu (désélectionné par défaut)",
]
addopts = "-m 'not gpu'"
asyncio_mode = "auto"
# L'exigence de sortie immaculee cesse d'etre une convention : tout
# avertissement devient un echec. Un filtre d'exception se justifie sur un
# message precis, jamais sur une classe entiere -- ce dernier avalerait aussi
# la prochaine depreciation, c'est-a-dire exactement le signal recherche.
filterwarnings = ["error"]
